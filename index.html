<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="theme-color" content="#0b0706" />
  <title>ASHSPORE</title>
  <link rel="manifest" href="manifest.json" />
  <style>
    :root {
      --ember:#ff6a2a; --ember2:#ffb347; --spore:#7dff9a; --dew:#6ec8ff;
      --spirit:#c9a6ff; --bone:#e8d7b0; --ink:#f4e8d4; --muted:#9a846c;
      --safe: env(safe-area-inset-top, 8px); --safeb: env(safe-area-inset-bottom, 10px);
    }
    * { box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
    html,body { margin:0; height:100%; background:#0b0706; color:var(--ink);
      font-family:"Trebuchet MS","Segoe UI",system-ui,sans-serif; overflow:hidden; user-select:none; touch-action:none; }
    #app { height:100%; position:relative; }
    .screen { position:absolute; inset:0; display:none; flex-direction:column; }
    .screen.on { display:flex; }
    #title {
      background: linear-gradient(#0b0706cc,#0b0706ee), url("art/title.jpg") center 30%/cover no-repeat;
      align-items:center; justify-content:center; text-align:center; padding:24px;
    }
    .cast { display:flex; gap:8px; justify-content:center; margin:0 0 16px; flex-wrap:wrap; }
    .cast img { width:58px; height:58px; object-fit:cover; object-position:top; border-radius:50%; border:2px solid #ffb347; }
    .logo { font-size:clamp(40px,12vw,70px); letter-spacing:.18em; font-weight:800; color:var(--ember2);
      text-shadow:0 0 24px #ff6a2a88; margin:0; }
    .tag { letter-spacing:.28em; font-size:11px; color:var(--muted); margin:6px 0 18px; }
    .blurb { max-width:340px; color:#d7c4a6; font-size:14px; line-height:1.5; margin-bottom:22px; }
    .bigbtn { width:min(86vw,320px); padding:16px; border:0; border-radius:14px;
      background:linear-gradient(#ff8a3d,#d44512); color:#2a0d04; font-weight:800; letter-spacing:.12em; font-size:16px; }
    .ghost { margin-top:12px; background:transparent; color:var(--bone); border:1px solid #5a4030; }
    .credits { position:absolute; bottom:calc(14px + var(--safeb)); font-size:11px; color:#6a5644; }
    #play { background:#0b0706; }
    #stage { position:absolute; inset:0; width:100%; height:100%; display:block; }
    #hud {
      position:absolute; left:0; right:0; top:0; z-index:5;
      padding:calc(6px + var(--safe)) 8px 6px;
      background:linear-gradient(#1c120eee,#120c0a00); font-size:11px;
      display:grid; grid-template-columns:1fr 1fr 1fr; gap:4px 8px; pointer-events:none;
    }
    .res { display:flex; align-items:center; gap:4px; }
    .bar { flex:1; height:6px; background:#2a1b14; border-radius:4px; overflow:hidden; }
    .bar i { display:block; height:100%; background:var(--ember); }
    #prompt {
      position:absolute; left:50%; bottom:132px; transform:translateX(-50%);
      z-index:6; display:none; padding:8px 14px; border-radius:12px;
      background:#1a100cee; border:1px solid #ffb347; font-size:12px; letter-spacing:.08em;
    }
    #pads {
      position:absolute; left:0; right:0; bottom:0; z-index:7;
      padding: 0 12px calc(10px + var(--safeb));
      display:flex; justify-content:space-between; align-items:flex-end; pointer-events:none;
    }
    #pads button { pointer-events:auto; width:64px; height:64px; border-radius:50%;
      border:1px solid #5a4030; background:#1a100ccc; color:var(--bone); font-weight:800; font-size:18px; }
    #pads .jump { width:74px; height:74px; background:#ff6a2acc; color:#2a0d04; border:0; }
    #pads .act { background:#7dff9a22; color:var(--spore); }
    #pads .row { display:flex; gap:8px; }
    .sheet {
      position:absolute; left:0; right:0; bottom:0; max-height:62%; overflow:auto; z-index:12;
      background:#140e0c; border-top:2px solid #3a261c; padding:14px 14px 28px;
      transform:translateY(110%); transition:transform .2s;
    }
    .sheet.on { transform:none; }
    .sheet h2 { margin:0 0 8px; font-size:16px; letter-spacing:.12em; color:var(--ember2); }
    .row { display:flex; justify-content:space-between; gap:8px; padding:8px 0; border-bottom:1px solid #2a1c16; }
    .mini { border:0; border-radius:8px; padding:6px 10px; background:#3a261c; color:var(--bone); font-weight:700; }
    .mini.hot { background:var(--ember); color:#2a0d04; }
    .face { width:36px; height:36px; border-radius:50%; overflow:hidden; background:#2a1b14; flex:0 0 36px; }
    .face img { width:100%; height:100%; object-fit:cover; object-position:top; }
    .person { display:flex; gap:8px; align-items:center; }
    #toast { position:absolute; left:50%; top:22%; transform:translateX(-50%); z-index:20;
      display:none; background:#1a100c; border:1px solid var(--ember); padding:8px 14px; border-radius:10px; font-size:13px; }
    #modal { position:absolute; inset:0; background:#0b0706cc; display:none; align-items:center; justify-content:center; z-index:30; padding:18px; }
    #modal.on { display:flex; }
    #modal .card { background:#1a100c; border:1px solid #3a261c; border-radius:16px; padding:18px; max-width:360px; }
    #worldwrap { position:relative; height:280px; border-radius:12px; overflow:hidden; margin:8px 0; background:#0b0706; }
    #atlas { position:absolute; inset:0; background:url("art/world.jpg") center/cover; transform-origin:50% 50%; transition:transform .3s; }
    .region { position:absolute; width:48px; height:48px; border-radius:50%; border:2px solid #e8d7b0;
      display:flex; align-items:center; justify-content:center; font-size:8px; font-weight:800; text-align:center;
      transform:translate(-50%,-50%); background:#1a1810cc; }
    #fog { position:absolute; inset:0; pointer-events:none; }
  </style>
</head>
<body>
  <div id="app">
    <section id="title" class="screen on">
      <div class="cast">
        <img src="art/chief.jpg" alt="" /><img src="art/thorn.jpg" alt="" />
        <img src="art/moss.jpg" alt="" /><img src="art/lumen.jpg" alt="" />
        <img src="art/raider.jpg" alt="" /><img src="art/oldone.jpg" alt="" />
      </div>
      <h1 class="logo">ASHSPORE</h1>
      <div class="tag">HOLD · BLOOM · WILDS</div>
      <p class="blurb">Walk the cut stone yourself. Post hands to the pits. Carry the bloom through the caves until the lands wear your name.</p>
      <button class="bigbtn" id="btnNew">LIGHT THE HEARTH</button>
      <button class="bigbtn ghost" id="btnCont" style="display:none">RETURN TO HOLD</button>
      <div class="credits">Phone-first · offline save</div>
    </section>

    <section id="play" class="screen">
      <canvas id="stage"></canvas>
      <div id="hud"></div>
      <div id="prompt"></div>
      <div id="pads">
        <div class="row">
          <button id="btnL">◀</button>
          <button id="btnR">▶</button>
        </div>
        <div class="row">
          <button class="act" id="btnAct">ACT</button>
          <button class="jump" id="btnJ">JUMP</button>
        </div>
      </div>
    </section>

    <div id="sheet" class="sheet"></div>
    <div id="toast"></div>
    <div id="modal"></div>
  </div>
<script>
const NAMES = ["Ash","Bran","Cinder","Dew","Ember","Flint","Grit","Hearth","Ivy","Jute","Kerr","Lumen","Moss","Nettle","Orin","Pike","Quill","Rook","Sable","Thorn","Ulna","Vex","Wren","Yarrow"];
const ROOM_DEFS = {
  empty:{name:"Hollow",prod:null,slots:0,cost:{}},
  hearth:{name:"Hearth",prod:"spirit",base:1.2,slots:2,stat:"voice",cost:{}},
  glowcap:{name:"Glowcap Pit",prod:"ember",base:2.4,slots:2,stat:"brawn",cost:{bone:40,food:10}},
  sporebed:{name:"Sporebed",prod:"food",base:2.2,slots:2,stat:"craft",cost:{bone:35,ember:8}},
  dewcatcher:{name:"Dewcatcher",prod:"dew",base:2.2,slots:2,stat:"sight",cost:{bone:35,ember:8}},
  den:{name:"Den",prod:null,pop:4,slots:0,cost:{bone:50,food:15}},
  altar:{name:"Bone Altar",prod:"spirit",base:1.6,slots:2,stat:"voice",cost:{bone:70,spirit:8}},
  barracks:{name:"Spore Barracks",prod:null,slots:2,war:true,stat:"grit",cost:{bone:80,food:20}},
  watchgate:{name:"Watchgate",prod:null,slots:2,defense:true,stat:"grit",cost:{bone:60}},
  nursery:{name:"Pairing Hollow",prod:null,slots:2,breed:true,stat:"voice",cost:{bone:90,food:25}},
};
const REGIONS = [
  {id:"glen",name:"Ashen Glen",x:50,y:48,pop:12000,climate:"temperate",links:["ribs","dewfen","crow"]},
  {id:"ribs",name:"Rib-Cairn",x:18,y:20,pop:8000,climate:"cold",links:["glen","night","crow"]},
  {id:"dewfen",name:"Dewfen",x:78,y:20,pop:9000,climate:"humid",links:["glen","coast","ember"]},
  {id:"crow",name:"Crow Pass",x:50,y:12,pop:5000,climate:"cold",links:["glen","ribs","night"]},
  {id:"coast",name:"Bone Coast",x:86,y:50,pop:11000,climate:"humid",links:["dewfen","ember","mouth"]},
  {id:"ember",name:"Ember Wastes",x:60,y:78,pop:4000,climate:"hot",links:["dewfen","coast","glen"]},
  {id:"night",name:"Nightwood",x:16,y:48,pop:7000,climate:"cold",links:["ribs","crow","mouth"]},
  {id:"mouth",name:"Old One Mouth",x:20,y:80,pop:6000,climate:"hot",links:["night","coast","ember"]},
];
const EVOLUTIONS = [
  {id:"wind",branch:"carry",name:"Wind Spores",cost:6,desc:"Rides the air between linked lands",fx:{air:1,inf:2}},
  {id:"beast",branch:"carry",name:"Beast Hide",cost:7,desc:"Elk and crows wear it outward",fx:{beast:1,inf:2}},
  {id:"dewvein",branch:"carry",name:"Dew Veins",cost:8,desc:"Travels rivers and the coast",fx:{water:1,inf:2}},
  {id:"warseed",branch:"carry",name:"Warband Blood",cost:9,desc:"Every wilds run seeds the land",fx:{war:1,inf:1}},
  {id:"cough",branch:"mark",name:"Coughbloom",cost:5,desc:"Spores in the throat. Spreads faster",fx:{inf:4,sev:1}},
  {id:"fever",branch:"mark",name:"Fever Cap",cost:6,desc:"Shamans notice. The land wakes",fx:{sev:4,inf:1}},
  {id:"fervor",branch:"mark",name:"Mycelial Fervor",cost:10,desc:"The marked walk home instead of rotting",fx:{convert:1,sev:2,inf:2}},
  {id:"bloom",branch:"mark",name:"Bone Bloom",cost:11,desc:"Ribs split into fruit",fx:{let:5,sev:3}},
  {id:"rot",branch:"mark",name:"Necrotic Rot",cost:14,desc:"Villages empty",fx:{let:8,sev:4}},
  {id:"hunger",branch:"mark",name:"Light Hunger",cost:8,desc:"Tribute walks the cords to the hearth",fx:{tribute:1,sev:2,inf:1}},
  {id:"cold",branch:"craft",name:"Cold Hardening",cost:7,desc:"Lives in Nightwood and cairns",fx:{cold:2}},
  {id:"heat",branch:"craft",name:"Heat Hardening",cost:7,desc:"Lives in Ember Wastes and the Mouth",fx:{heat:2}},
  {id:"damp",branch:"craft",name:"Gill Spores",cost:6,desc:"Loves Dewfen and the Coast",fx:{humid:2}},
  {id:"veil",branch:"craft",name:"Fog Veil",cost:9,desc:"Hides the bloom from rival rites",fx:{stealth:3,sev:-2}},
  {id:"burst",branch:"craft",name:"Spore Burst",cost:12,desc:"A pulse through every touched land",fx:{burst:1,inf:1}},
];
const UNITS = {
  sporeling:{name:"Sporeling",file:"sporeling",speed:210,atk:8,hp:70},
  boneguard:{name:"Bone Guard",file:"boneguard",speed:150,atk:12,hp:130},
  capthrow:{name:"Cap-Thrower",file:"capthrow",speed:180,atk:14,hp:80},
  veinwalker:{name:"Vein-Walker",file:"veinwalker",speed:250,atk:9,hp:75},
  convert:{name:"Fervor Convert",file:"convert",speed:190,atk:16,hp:95},
  seerspark:{name:"Seer-Spark",file:"seerspark",speed:220,atk:11,hp:60,hover:true},
};

const $ = id => document.getElementById(id);
const rnd = (a,b)=> a+Math.floor(Math.random()*(b-a+1));
const pick = a => a[rnd(0,a.length-1)];
const clamp = (n,a,b)=> Math.max(a,Math.min(b,n));
function hash32(s){ let h=2166136261; s=String(s); for(let i=0;i<s.length;i++){h^=s.charCodeAt(i);h=Math.imul(h,16777619);} return h>>>0; }
function mulberry(seed){ let t=seed>>>0; return ()=>{ t+=0x6D2B79F5; let x=Math.imul(t^(t>>>15),1|t); x^=x+Math.imul(x^(x>>>7),61|x); return ((x^(x>>>14))>>>0)/4294967296; }; }

const FACE_CACHE = {};
function paintPortrait(seed){
  if (FACE_CACHE[seed]) return FACE_CACHE[seed];
  const rng = mulberry(hash32(seed));
  const c=document.createElement("canvas"); c.width=96; c.height=96; const g=c.getContext("2d");
  const glow=["#ff6a2a","#7dff9a","#6ec8ff","#c9a6ff","#ffb347"][Math.floor(rng()*5)];
  g.fillStyle="#140c08"; g.fillRect(0,0,96,96);
  g.fillStyle=`hsl(${18+rng()*28},${42+rng()*30}%,${38+rng()*22}%)`;
  g.beginPath(); g.ellipse(48,50,24,27,0,0,6.28); g.fill();
  g.fillStyle=`hsl(${rng()*360},${30+rng()*40}%,${12+rng()*18}%)`;
  g.beginPath(); g.ellipse(48,30,24,14,0,Math.PI,0); g.fill();
  g.fillStyle=glow; g.beginPath(); g.arc(40,48,3,0,6.28); g.arc(56,48,3,0,6.28); g.fill();
  FACE_CACHE[seed]=c.toDataURL("image/jpeg",0.7); return FACE_CACHE[seed];
}
function faceHTML(d){
  if (!d) return "";
  if (d.portrait) return `<img src="${d.portrait}" alt="">`;
  return `<img src="${paintPortrait(d.faceSeed||d.id)}" alt="">`;
}

function blankBloom(){
  const lands={}; REGIONS.forEach(r=>lands[r.id]={inf:0,dead:0,closed:false,aware:0});
  lands.glen.inf=40;
  const veins=[];
  REGIONS.forEach(r=>r.links.forEach(nid=>{ if(r.id<nid) veins.push({a:r.id,b:nid,w:1,flow:0,grown:false}); }));
  return {dna:8,inf:4,sev:1,let:0,air:0,water:0,beast:0,war:0,heat:0,cold:0,humid:0,stealth:0,convert:0,tribute:0,
    evolved:[],lands,veins,caravans:[],cure:0,cureOn:false,news:"A cough in Ashen Glen. The hearth tastes of cap and ash.",won:null};
}
function newDweller(role, forced={}){
  const d={id:"d"+Date.now().toString(36)+rnd(10,99),
    name:pick(NAMES)+" "+pick(["Ashborn","Sporekin","Emberfell","Wilds","Bone"]),
    role:role||pick(["hunter","gatherer","seer","guard"]),
    brawn:rnd(1,4),sight:rnd(1,4),grit:rnd(1,4),voice:rnd(1,4),craft:rnd(1,4),
    hp:100,happy:70,room:null,xp:0,faceSeed:null};
  Object.assign(d,forced);
  if(!d.portrait) d.faceSeed=d.faceSeed||d.id;
  return d;
}
function blankHold(){
  const dwellers=[
    newDweller("chief",{name:"Chief Ashborn",portrait:"art/chief.jpg",brawn:4,sight:3,grit:5,voice:6,craft:3,happy:80}),
    newDweller("hunter",{name:"Thorn Wilds",portrait:"art/thorn.jpg",brawn:3,grit:5,sight:4}),
    newDweller("gatherer",{name:"Moss Sporekin",portrait:"art/moss.jpg",craft:5,voice:3}),
    newDweller("seer",{name:"Lumen Emberfell",portrait:"art/lumen.jpg",voice:5,sight:4}),
  ];
  const floors=[
    {id:0,kind:"gate",locked:false,slots:[
      {id:"g0",type:"watchgate",lv:1,workers:[],ready:0},
      {id:"g1",type:"hearth",lv:1,workers:[],ready:0},
      {id:"g2",type:"empty",lv:1,workers:[],ready:0},
    ]},
    {id:1,kind:"cave",locked:false,slots:[
      {id:"a0",type:"glowcap",lv:1,workers:[],ready:0},
      {id:"a1",type:"sporebed",lv:1,workers:[],ready:0},
      {id:"a2",type:"dewcatcher",lv:1,workers:[],ready:0},
    ]},
    {id:2,kind:"cave",locked:false,slots:[
      {id:"b0",type:"den",lv:1,workers:[],ready:0},
      {id:"b1",type:"empty",lv:1,workers:[],ready:0},
      {id:"b2",type:"empty",lv:1,workers:[],ready:0},
    ]},
    {id:3,kind:"cave",locked:true,slots:[
      {id:"c0",type:"empty",lv:1,workers:[],ready:0},
      {id:"c1",type:"empty",lv:1,workers:[],ready:0},
      {id:"c2",type:"empty",lv:1,workers:[],ready:0},
    ]},
  ];
  dwellers[0].room="g1"; floors[0].slots[1].workers=[dwellers[0].id];
  dwellers[1].room="g0"; floors[0].slots[0].workers=[dwellers[1].id];
  dwellers[2].room="a1"; floors[1].slots[1].workers=[dwellers[2].id];
  dwellers[3].room="a0"; floors[1].slots[0].workers=[dwellers[3].id];
  return {day:1,t:0,res:{ember:48,food:52,dew:50,spirit:12,bone:80},
    cap:{ember:90,food:90,dew:90,spirit:40},happiness:72,dwellers,floors,
    log:["The hearth catches."],warsWon:0,bloom:blankBloom(),form:"sporeling"};
}

let S=null, raf=0, mode="hold", near=null, keys={};
const G={player:null,plats:[],actors:[],cam:{x:0,y:0},W:1600,H:900,goal:null,region:"glen"};

const IMG={};
["art/hold.jpg","art/battle.jpg","art/chief.jpg","art/units/sporeling.png","art/units/boneguard.png",
 "art/units/capthrow.png","art/units/veinwalker.png","art/units/convert.png","art/units/seerspark.png"].forEach(src=>{
  const im=new Image(); im.src=src; IMG[src]=im;
});
function unitImg(k){ return IMG["art/units/"+(UNITS[k]||UNITS.sporeling).file+".png"]; }

function allRooms(){ const o=[]; S.floors.forEach(f=>f.slots.forEach(r=>o.push({floor:f,room:r}))); return o; }
function roomById(id){ for(const f of S.floors) for(const r of f.slots) if(r.id===id) return r; return null; }
function popCap(){ let n=6; allRooms().forEach(({room})=>{ if(room.type==="den") n+=4*room.lv; }); return n; }
function idleDwellers(){ return S.dwellers.filter(d=>!d.room); }
function worldStats(){
  let pop=0,inf=0,dead=0;
  REGIONS.forEach(r=>{ const L=S.bloom.lands[r.id]; pop+=r.pop; inf+=L.inf; dead+=L.dead; });
  return {pop,inf,dead,healthy:Math.max(0,pop-dead-inf)};
}
function regionPct(id){
  const r=REGIONS.find(x=>x.id===id), L=S.bloom.lands[id];
  return clamp(L.inf/Math.max(1,r.pop-L.dead),0,1);
}

function save(){ localStorage.setItem("ashspore_v1", JSON.stringify(S)); }
function load(){
  try{
    const s=JSON.parse(localStorage.getItem("ashspore_v1"));
    if(!s) return null;
    if(!s.bloom) s.bloom = s.plague || blankBloom();
    if(s.bloom && !s.bloom.veins) s.bloom.veins=blankBloom().veins;
    if(!s.form) s.form="sporeling";
    return s;
  }catch(e){ return null; }
}

function toast(t){ const el=$("toast"); el.textContent=t; el.style.display="block"; clearTimeout(toast._t); toast._t=setTimeout(()=>el.style.display="none",2000); }
function pushLog(t){ S.log.unshift("Day "+S.day+" · "+t); S.log=S.log.slice(0,40); }

function consumeAndProduce(dt){
  const pop=S.dwellers.length;
  S.res.food=clamp(S.res.food-pop*0.035*dt,0,S.cap.food);
  S.res.dew=clamp(S.res.dew-pop*0.032*dt,0,S.cap.dew);
  if(S.res.food<1) S.happiness=Math.max(5,S.happiness-0.4*dt);
  else S.happiness=Math.min(100,S.happiness+0.05*dt);
  allRooms().forEach(({room,floor})=>{
    if(floor.locked) return;
    const def=ROOM_DEFS[room.type]; if(!def||!def.prod) return;
    const wr=room.workers.map(id=>S.dwellers.find(d=>d.id===id)).filter(Boolean);
    const stat=def.stat||"craft";
    const bonus=wr.reduce((a,d)=>a+(d[stat]||1),0);
    room.ready=Math.min(20,(room.ready||0)+(def.base*room.lv*(0.35+bonus*0.12))*dt*0.12);
  });
}

function climateMul(c,P){
  if(c==="hot") return 0.45+P.heat*0.28;
  if(c==="cold") return 0.45+P.cold*0.28;
  if(c==="humid") return 0.7+P.humid*0.2;
  return 1;
}
function tickBloom(dt){
  const P=S.bloom; if(!P||P.won) return;
  REGIONS.forEach(r=>{
    const L=P.lands[r.id]; const alive=Math.max(1,r.pop-L.dead); const inf=Math.min(L.inf,alive);
    const rate=(0.012+P.inf*0.004)*climateMul(r.climate,P)*(L.closed?0.35:1);
    L.inf=Math.min(alive,L.inf+inf*(alive-inf)/alive*rate*dt);
    const kill=inf*(P.let*0.0018)*dt;
    L.dead=Math.min(r.pop,L.dead+kill*(P.convert?0.55:1));
    L.inf=Math.max(0,L.inf-kill);
    L.aware=Math.min(100,L.aware+(P.sev*0.08-P.stealth*0.06)*(inf/alive)*dt*8);
    if(!L.closed && L.aware>55 && inf/alive>0.12){ L.closed=true; P.news=r.name+" seals its roads."; }
    (P.veins||[]).filter(v=>v.a===r.id||v.b===r.id).forEach(v=>{
      const nid=v.a===r.id?v.b:v.a; const N=P.lands[nid]; const dest=REGIONS.find(x=>x.id===nid);
      if(!dest||N.inf>dest.pop*0.9) return;
      let ch=0.0008*P.inf*climateMul(dest.climate,P)*(v.grown?1.6:1);
      if(P.air) ch+=0.0012*P.air; if(L.closed||N.closed) ch*=0.4;
      if(inf>80 && Math.random()<ch*dt){ if(N.inf<=0){ P.dna+=3; P.news="First cough in "+dest.name+"."; } N.inf+=8+P.inf*2; }
    });
  });
  if(P.tribute){ const w=worldStats(); S.res.food=clamp(S.res.food+w.inf/18000*dt,0,S.cap.food); S.res.bone+=w.inf/22000*dt; }
  if(P.convert && S.dwellers.length<popCap() && Math.random()<0.0015*dt){
    const d=newDweller("converted"); S.dwellers.push(d); pushLog(d.name+" walks in already blooming.");
  }
  const w=worldStats(); const infPct=w.inf/Math.max(1,w.pop-w.dead);
  if(!P.cureOn && P.sev>=6 && infPct>0.08){ P.cureOn=true; P.news="Shamans of the Mouth begin a rival rite."; toast("A rival rite has begun."); }
  if(P.cureOn && !P.won){
    P.cure=Math.min(100,P.cure+Math.max(0.08,(P.sev*0.35+infPct*4)-P.stealth*0.7)*dt*0.12);
    if(P.cure>=100){ P.won="cure"; P.news="The rival rite burns the bloom back."; showBloomEnd(false); }
  }
  if(!P.won && w.healthy<w.pop*0.02 && w.inf+w.dead>w.pop*0.9){
    P.won="spread"; P.news="Every land wears your bloom."; S.res.bone+=80; showBloomEnd(true);
  }
}

function showBloomEnd(win){
  $("modal").className="on";
  $("modal").innerHTML = `<div class="card"><h2>${win?"THE LANDS WEAR YOU":"THE RIVAL RITE"}</h2>
    <p>${win?"Every region coughs your name. Tribute walks home.":"Rival shamans cut the bloom down. Grow Fog Veil sooner."}</p>
    <button class="bigbtn" id="okend">KEEP THE FIRE</button></div>`;
  $("okend").onclick=()=>{
    $("modal").className="";
    if(!win){ REGIONS.forEach(r=>S.bloom.lands[r.id].inf*=0.08); S.bloom.cure=0; S.bloom.cureOn=false; S.bloom.won=null; }
  };
}

/* ---------- 2.5D platformer ---------- */
function rect(x,y,w,h,tag,meta){ return {x,y,w,h,tag:tag||"plat",meta:meta||null}; }
function buildHoldLevel(){
  const plats=[], actors=[];
  const W=1680, floorH=150, ground=820;
  plats.push(rect(0,ground,W,80,"floor"));
  plats.push(rect(780,120,70,ground-120,"ladder"));
  S.floors.forEach((f,fi)=>{
    const y = ground - 8 - fi*floorH;
    if(f.locked) return;
    f.slots.forEach((room,si)=>{
      const x = 80 + si*420;
      plats.push(rect(x,y,360,22,"room",{room,floor:f}));
      const wr=room.workers.map(id=>S.dwellers.find(d=>d.id===id)).filter(Boolean);
      wr.forEach((d,i)=> actors.push({kind:"npc",d,x:x+70+i*70,y:y,facing:1,form:d.role==="chief"?"boneguard":"sporeling"}));
    });
  });
  plats.push(rect(40,ground-8,90,90,"gate"));
  plats.push(rect(W-160,ground-8,90,90,"altar"));
  G.W=W; G.H=960; G.plats=plats; G.actors=actors; G.goal=null;
  G.player={x:520,y:ground-8,vx:0,vy:0,w:28,h:52,on:false,facing:1,hp:100,form:S.form||"sporeling",inv:0};
}

function buildWilds(regionId){
  const rng=mulberry(hash32(regionId+":"+S.day+":"+S.warsWon));
  const W=3200, ground=780;
  const plats=[rect(0,ground,W,90,"floor")];
  for(let i=0;i<18;i++){
    const x=180+i*160+rng()*40, y=ground-80-Math.floor(rng()*4)*70, w=90+rng()*80;
    plats.push(rect(x,y,w,18,"plat"));
  }
  const actors=[];
  const kinds=Object.keys(UNITS);
  for(let i=0;i<8;i++){
    actors.push({kind:"foe",form:kinds[Math.floor(rng()*kinds.length)],x:500+i*280,y:ground,facing:-1,hp:40+S.bloom.inf,patrol:500+i*280,inv:0});
  }
  G.W=W; G.H=920; G.plats=plats; G.actors=actors; G.goal=rect(W-140,ground-8,80,80,"shrine");
  G.region=regionId;
  G.player={x:80,y:ground-8,vx:0,vy:0,w:28,h:52,on:false,facing:1,hp:UNITS[S.form].hp,form:S.form,inv:0};
}

function aabb(a,b){ return a.x < b.x+b.w && a.x+a.w > b.x && a.y-a.h < b.y && a.y > b.y-b.h; }
function standingOn(p, plat){
  return p.x+p.w>plat.x && p.x<plat.x+plat.w && p.y<=plat.y+6 && p.y>=plat.y-8 && p.vy>=0;
}

function stepPhys(p, dt){
  const U=UNITS[p.form]||UNITS.sporeling;
  const spd = U.speed;
  p.vx = 0;
  if(keys.l) { p.vx=-spd; p.facing=-1; }
  if(keys.r) { p.vx=spd; p.facing=1; }
  if(keys.j && p.on){ p.vy=-620; p.on=false; keys.j=false; }
  p.vy += 1800*dt;
  p.x += p.vx*dt;
  p.y += p.vy*dt;
  p.on=false;
  G.plats.forEach(pl=>{
    if(pl.tag==="ladder"){
      if(p.x+p.w>pl.x && p.x<pl.x+pl.w && p.y>pl.y && p.y-p.h<pl.y+pl.h){
        if(keys.j){ p.vy=-220; p.on=true; }
        p.vy=Math.min(p.vy,80);
      }
      return;
    }
    if(standingOn(p,pl)){ p.y=pl.y; p.vy=0; p.on=true; }
  });
  p.x=clamp(p.x,8,G.W-36);
  if(p.y>G.H){ p.y=780; p.vy=0; p.hp-=15; }
  if(p.inv>0) p.inv-=dt;
}

function stepWorld(dt){
  const p=G.player;
  stepPhys(p,dt);
  G.actors.forEach(a=>{
    if(a.kind==="foe"){
      a.x += a.facing*50*dt;
      if(Math.abs(a.x-a.patrol)>90) a.facing*=-1;
      const hit={x:a.x,y:a.y,w:28,h:50};
      if(p.inv<=0 && aabb({x:p.x,y:p.y,w:p.w,h:p.h},hit)){
        p.hp-=8; p.inv=0.6; p.vx=a.facing*200; p.vy=-240;
      }
    }
  });
  near=null;
  if(mode==="hold"){
    G.plats.forEach(pl=>{
      if((pl.tag==="room"||pl.tag==="gate"||pl.tag==="altar") && Math.abs(p.x-(pl.x+pl.w/2))<90 && Math.abs(p.y-pl.y)<40)
        near=pl;
    });
  } else {
    if(G.goal && Math.abs(p.x-(G.goal.x+40))<70) near=G.goal;
  }
  const pr=$("prompt");
  if(near){
    pr.style.display="block";
    pr.textContent = near.tag==="room" ? "ACT · "+(ROOM_DEFS[near.meta.room.type]||{}).name : near.tag==="gate"?"ACT · enter the wilds":near.tag==="altar"?"ACT · tend the bloom":"ACT · claim the shrine";
  } else pr.style.display="none";

  G.cam.x = clamp(p.x - innerWidth*0.35, 0, G.W-innerWidth);
  G.cam.y = clamp(p.y - innerHeight*0.62, 0, G.H-innerHeight);
}

function doAct(){
  if(!near){
    if(mode==="wilds") swing();
    return;
  }
  if(near.tag==="room") openRoom(near.meta.room);
  else if(near.tag==="gate") openWildsPick();
  else if(near.tag==="altar") openBloom();
  else if(near.tag==="shrine") winWilds();
}

function swing(){
  const p=G.player; const U=UNITS[p.form];
  const box={x:p.facing>0?p.x+p.w:p.x-36,y:p.y,w:36,h:p.h};
  G.actors.forEach(a=>{
    if(a.kind!=="foe"||a.hp<=0) return;
    if(aabb(box,{x:a.x,y:a.y,w:28,h:50})){ a.hp-=U.atk; a.x+=p.facing*30; }
  });
  G.actors=G.actors.filter(a=>a.kind!=="foe"||a.hp>0);
}

function drawBillboard(ctx, img, x, y, facing, form, enemy, t){
  const hover = (UNITS[form]||{}).hover ? Math.sin(t*5)*6 : 0;
  const bob = Math.sin(t*10)*2;
  const w=54, h=78;
  ctx.save();
  ctx.fillStyle="rgba(0,0,0,.4)";
  ctx.beginPath(); ctx.ellipse(x,y+4,16,5,0,0,6.28); ctx.fill();
  ctx.translate(x, y-h+8+bob-hover);
  ctx.scale(facing<0?-1:1,1);
  if(img && img.complete && img.naturalWidth){
    if(enemy) ctx.filter="hue-rotate(210deg) saturate(1.2)";
    ctx.drawImage(img, -w/2, 0, w, h);
    ctx.filter="none";
  } else {
    ctx.fillStyle=enemy?"#8b4dff":"#ff8a3d";
    ctx.fillRect(-10,20,20,40); ctx.beginPath(); ctx.arc(0,16,14,0,6.28); ctx.fill();
  }
  ctx.restore();
}

function draw(){
  const c=$("stage"), ctx=c.getContext("2d");
  const w=c.width, h=c.height, dpr=devicePixelRatio||1;
  ctx.setTransform(dpr,0,0,dpr,0,0);
  const vw=w/dpr, vh=h/dpr;
  ctx.fillStyle="#0b0706"; ctx.fillRect(0,0,vw,vh);
  const bg = mode==="hold"?IMG["art/hold.jpg"]:IMG["art/battle.jpg"];
  if(bg && bg.complete){
    ctx.globalAlpha=0.55;
    ctx.drawImage(bg, -G.cam.x*0.25, -G.cam.y*0.1, vw+200, vh+80);
    ctx.globalAlpha=1;
  }
  ctx.save();
  ctx.translate(-G.cam.x, -G.cam.y);
  // depth floor
  G.plats.forEach(pl=>{
    if(pl.tag==="ladder"){
      ctx.fillStyle="#5a3a22"; ctx.fillRect(pl.x+20,pl.y,12,pl.h);
      for(let y=pl.y;y<pl.y+pl.h;y+=22){ ctx.fillStyle="#c9a06a"; ctx.fillRect(pl.x+8,y,36,4); }
      return;
    }
    ctx.fillStyle = pl.tag==="room"?"#3a261c":"#2a1b14";
    ctx.fillRect(pl.x, pl.y, pl.w, pl.h);
    ctx.fillStyle="#1a100c";
    ctx.beginPath(); ctx.moveTo(pl.x,pl.y); ctx.lineTo(pl.x+18,pl.y-10); ctx.lineTo(pl.x+pl.w+18,pl.y-10); ctx.lineTo(pl.x+pl.w,pl.y); ctx.fill();
    if(pl.tag==="room"){
      const def=ROOM_DEFS[pl.meta.room.type];
      ctx.fillStyle="#e8d7b0"; ctx.font="12px sans-serif";
      ctx.fillText((def&&def.name)||"Hollow", pl.x+12, pl.y-16);
      if(pl.meta.room.ready>=8){ ctx.fillStyle="#ffb347"; ctx.fillText("READY", pl.x+pl.w-60, pl.y-16); }
    }
    if(pl.tag==="gate"){ ctx.fillStyle="#ff8a3d"; ctx.fillRect(pl.x+20,pl.y-70,50,70); ctx.fillStyle="#2a0d04"; ctx.fillText("WILDS",pl.x+24,pl.y-80); }
    if(pl.tag==="altar"){ ctx.fillStyle="#7dff9a"; ctx.fillRect(pl.x+20,pl.y-40,50,40); ctx.fillStyle="#e8d7b0"; ctx.fillText("BLOOM",pl.x+22,pl.y-48); }
  });
  if(G.goal){ ctx.fillStyle="#c9a6ff"; ctx.fillRect(G.goal.x, G.goal.y-70, 70,70); ctx.fillStyle="#fff"; ctx.fillText("SHRINE",G.goal.x, G.goal.y-78); }
  const t=performance.now()/1000;
  G.actors.forEach(a=>{
    drawBillboard(ctx, unitImg(a.form), a.x+14, a.y, a.facing||1, a.form, a.kind==="foe", t);
  });
  const p=G.player;
  drawBillboard(ctx, unitImg(p.form), p.x+14, p.y, p.facing, p.form, false, t);
  ctx.restore();
  // hp
  ctx.fillStyle="#3a1210"; ctx.fillRect(12, vh-118, 120, 8);
  ctx.fillStyle="#c44536"; ctx.fillRect(12, vh-118, 120*(p.hp/Math.max(1,(UNITS[p.form]||UNITS.sporeling).hp)), 8);
}

function loop(now){
  if(!S) return;
  const dt=Math.min(0.033,(loop._l?(now-loop._l):16)/1000); loop._l=now;
  stepWorld(dt);
  draw();
  raf=requestAnimationFrame(loop);
}

function renderHud(){
  const w=worldStats(); const inf=Math.floor(100*w.inf/Math.max(1,w.pop-w.dead));
  $("hud").innerHTML=`
    <div class="res">EM <div class="bar"><i style="width:${S.res.ember/S.cap.ember*100}%;background:var(--ember)"></i></div>${Math.floor(S.res.ember)}</div>
    <div class="res">FD <div class="bar"><i style="width:${S.res.food/S.cap.food*100}%;background:var(--spore)"></i></div>${Math.floor(S.res.food)}</div>
    <div class="res">DW <div class="bar"><i style="width:${S.res.dew/S.cap.dew*100}%;background:var(--dew)"></i></div>${Math.floor(S.res.dew)}</div>
    <div class="res">SP <div class="bar"><i style="width:${S.res.spirit/S.cap.spirit*100}%;background:var(--spirit)"></i></div>${Math.floor(S.res.spirit)}</div>
    <div class="res">🦴 ${Math.floor(S.res.bone)} · 😊 ${Math.floor(S.happiness)}</div>

}

function tick(){
  if(!S) return;
  S.t++; if(S.t%60===0) S.day++;
  consumeAndProduce(1); tickBloom(1);
  if(S.t%8===0) save();
  renderHud();
}

function closeSheet(){ $("sheet").classList.remove("on"); }
function openRoom(room){
  const def=ROOM_DEFS[room.type]||ROOM_DEFS.empty;
  const wr=room.workers.map(id=>S.dwellers.find(d=>d.id===id)).filter(Boolean);
  const el=$("sheet"); el.classList.add("on");
  if(room.type==="empty"){
    el.innerHTML=`<h2>HOLLOW</h2>${Object.keys(ROOM_DEFS).filter(k=>k!=="empty"&&k!=="hearth").map(k=>{
      const d=ROOM_DEFS[k]; const cost=Object.entries(d.cost||{}).map(([a,b])=>b+" "+a).join(" · ");
      return `<div class="row"><div><b>${d.name}</b><small> ${cost}</small></div><button class="mini hot" data-b="${k}">RAISE</button></div>`;
    }).join("")}<button class="mini" style="width:100%" id="x">CLOSE</button>`;
    el.querySelectorAll("[data-b]").forEach(b=>b.onclick=()=>{
      const d=ROOM_DEFS[b.dataset.b];
      for(const [k,v] of Object.entries(d.cost||{})){ if((S.res[k]||0)<v) return toast("Need more "+k); }
      for(const [k,v] of Object.entries(d.cost||{})) S.res[k]-=v;
      room.type=b.dataset.b; toast(d.name+" raised."); closeSheet(); buildHoldLevel();
    });
  } else {
    el.innerHTML=`<h2>${def.name} Lv${room.lv}</h2>
      ${room.ready>=8&&def.prod?`<button class="mini hot" style="width:100%" id="take">TAKE ${def.prod.toUpperCase()}</button>`:""}
      <div class="row"><div><b>Upgrade</b></div><button class="mini hot" id="up">UP ${30*room.lv} bone</button></div>
      ${wr.map(d=>`<div class="row person"><div class="face">${faceHTML(d)}</div><div><b>${d.name}</b></div><button class="mini" data-un="${d.id}">PULL</button></div>`).join("")}
      ${idleDwellers().map(d=>`<div class="row person"><div class="face">${faceHTML(d)}</div><div><b>${d.name}</b></div><button class="mini hot" data-as="${d.id}">POST</button></div>`).join("")}
      <button class="mini" style="width:100%" id="x">CLOSE</button>`;
    const take=$("take"); if(take) take.onclick=()=>{
      const n=room.ready; S.res[def.prod]=clamp((S.res[def.prod]||0)+n,0,S.cap[def.prod]||999); room.ready=0; toast("Took "+def.prod); closeSheet();
    };
    $("up").onclick=()=>{ const c=30*room.lv; if(S.res.bone<c) return toast("Need bone."); S.res.bone-=c; room.lv++; toast("Raised."); closeSheet(); buildHoldLevel(); };
    el.querySelectorAll("[data-un]").forEach(b=>b.onclick=()=>{ const d=S.dwellers.find(x=>x.id===b.dataset.un); d.room=null; room.workers=room.workers.filter(id=>id!==d.id); closeSheet(); openRoom(room); buildHoldLevel(); });
    el.querySelectorAll("[data-as]").forEach(b=>b.onclick=()=>{
      if(room.workers.length>= (def.slots||0)+room.lv-1) return toast("Full.");
      const d=S.dwellers.find(x=>x.id===b.dataset.as); d.room=room.id; room.workers.push(d.id); closeSheet(); openRoom(room); buildHoldLevel();
    });
  }
  $("x").onclick=closeSheet;
}

function openWildsPick(){
  const el=$("sheet"); el.classList.add("on");
  el.innerHTML=`<h2>WEAR A BODY · WALK THE WILDS</h2>
    ${Object.keys(UNITS).map(k=>`<div class="row"><div><b>${UNITS[k].name}</b><small>spd ${UNITS[k].speed} · atk ${UNITS[k].atk}</small></div>
      <button class="mini hot" data-f="${k}">WEAR</button></div>`).join("")}
    ${REGIONS.map(r=>`<div class="row"><div><b>${r.name}</b><small>bloom ${Math.floor(regionPct(r.id)*100)}%</small></div>
      <button class="mini hot" data-r="${r.id}">RUN</button></div>`).join("")}
    <button class="mini" style="width:100%" id="x">CLOSE</button>`;
  el.querySelectorAll("[data-f]").forEach(b=>b.onclick=()=>{ S.form=b.dataset.f; toast("Wearing "+UNITS[S.form].name); G.player.form=S.form; });
  el.querySelectorAll("[data-r]").forEach(b=>b.onclick=()=>{
    if(S.res.spirit<4) return toast("Need spirit to leave the hold.");
    S.res.spirit-=4; closeSheet(); mode="wilds"; buildWilds(b.dataset.r);
  });
  $("x").onclick=closeSheet;
}

function winWilds(){
  const r=REGIONS.find(x=>x.id===G.region);
  S.warsWon++; S.res.bone+=24; S.res.food=clamp(S.res.food+10,0,S.cap.food); S.bloom.dna+=6;
  const L=S.bloom.lands[G.region];
  L.inf=Math.min(r.pop-L.dead, L.inf+80+S.bloom.inf*10+(S.bloom.war?120:20));
  if(S.dwellers.length<popCap() && Math.random()<0.5){ const d=newDweller("awakened"); S.dwellers.push(d); toast(d.name+" followed you home."); }
  toast(r.name+" shrine claimed. The bloom thickens.");
  mode="hold"; buildHoldLevel();
}

function openBloom(){
  const P=S.bloom, w=worldStats(), infPct=Math.floor(100*w.inf/Math.max(1,w.pop-w.dead));
  const el=$("sheet"); el.classList.add("on");
  el.innerHTML=`<h2>ASHSPORE BLOOM</h2>
    <div class="row"><div><b>${Math.floor(P.dna)} DNA</b></div><div>bloom ${infPct}% · rival rite ${P.cureOn?Math.floor(P.cure)+"%":"—"}</div></div>
    <div id="worldwrap"><div id="atlas">${REGIONS.map(r=>{
      const pct=regionPct(r.id); const L=P.lands[r.id];
      return `<button class="region" data-reg="${r.id}" style="left:${r.x}%;top:${r.y}%;border-color:${L.closed?"#c44536":pct>0.05?"#7dff9a":"#4a5a38"}">${r.name.split(" ")[0]}<br>${Math.floor(pct*100)}%</button>`;
    }).join("")}</div><canvas id="fog"></canvas></div>
    <p style="font-size:12px;color:#cbb89a">${P.news} · tap two blooming lands to grow a vein (6 DNA)</p>
    ${["carry","mark","craft"].map(br=>`
      <div style="color:#9a846c;font-size:11px;letter-spacing:.12em;margin:8px 0 4px">${br.toUpperCase()}</div>
      ${EVOLUTIONS.filter(e=>e.branch===br).map(e=>{
        const on=P.evolved.includes(e.id);
        return `<div class="row"><div><b>${on?"✓ ":""}${e.name}</b><small>${e.desc} · ${e.cost}</small></div>
          <button class="mini ${on?"":"hot"}" data-ev="${e.id}" ${on?"disabled":""}>${on?"IN":"GROW"}</button></div>`;
      }).join("")}
    `).join("")}
    <button class="mini" style="width:100%" id="x">CLOSE</button>`;
  let pickA=null;
  el.querySelectorAll("[data-reg]").forEach(b=>b.onclick=()=>{
    const id=b.dataset.reg; const r=REGIONS.find(x=>x.id===id);
    $("atlas").style.transform=`translate(${(50-r.x)*1.1}%,${(50-r.y)*1.1}%) scale(2.1)`;
    if(pickA && pickA!==id){ growVein(pickA,id); pickA=null; openBloom(); return; }
    pickA=id; toast(r.name+" · tap another blooming land to grow a vein");
  });
  el.querySelectorAll("[data-ev]").forEach(b=>b.onclick=()=>evolve(b.dataset.ev));
  $("x").onclick=closeSheet;
  startFog();
}
function growVein(a,b){
  const P=S.bloom;
  if(regionPct(a)<0.05||regionPct(b)<0.05) return toast("Both lands must bloom.");
  if(P.dna<6) return toast("Need 6 DNA.");
  P.dna-=6;
  const ex=P.veins.find(v=>(v.a===a&&v.b===b)||(v.a===b&&v.b===a));
  if(ex) ex.grown=true; else P.veins.push({a,b,w:0.6,flow:1,grown:true});
  toast("A living vein thickens.");
}
function evolve(id){
  const P=S.bloom, ev=EVOLUTIONS.find(e=>e.id===id);
  if(!ev||P.evolved.includes(id)) return;
  if(P.dna<ev.cost) return toast("Need more DNA.");
  P.dna-=ev.cost; P.evolved.push(id);
  Object.entries(ev.fx).forEach(([k,v])=>{ if(k==="burst"){ REGIONS.forEach(r=>{ const L=P.lands[r.id]; if(L.inf>0) L.inf+=220; }); } else P[k]=(P[k]||0)+v; });
  toast("Grew "+ev.name); openBloom();
}
function startFog(){
  const c=$("fog"), wrap=$("worldwrap"); if(!c||!wrap) return;
  c.width=wrap.clientWidth; c.height=wrap.clientHeight;
  const ctx=c.getContext("2d");
  const parts=Array.from({length:24},()=>({x:Math.random()*c.width,y:Math.random()*c.height,r:8+Math.random()*16,v:8+Math.random()*10,a:0.1}));
  const step=()=>{
    if(!$("fog")) return;
    ctx.clearRect(0,0,c.width,c.height);
    parts.forEach(p=>{ p.y-=p.v*0.016; if(p.y<0) p.y=c.height; ctx.fillStyle=`rgba(125,255,154,${p.a})`; ctx.beginPath(); ctx.arc(p.x,p.y,p.r,0,6.28); ctx.fill(); });
    (S.bloom.veins||[]).forEach(v=>{
      const A=REGIONS.find(r=>r.id===v.a), B=REGIONS.find(r=>r.id===v.b);
      ctx.strokeStyle=v.grown?"rgba(255,180,70,.7)":"rgba(125,255,154,.35)";
      ctx.lineWidth=2; ctx.beginPath(); ctx.moveTo(A.x/100*c.width,A.y/100*c.height); ctx.lineTo(B.x/100*c.width,B.y/100*c.height); ctx.stroke();
    });
    requestAnimationFrame(step);
  };
  requestAnimationFrame(step);
}

function bindPads(){
  const hold=(id,k,on)=>{ const el=$(id); const go=e=>{ e.preventDefault(); keys[k]=on; }; el.addEventListener("pointerdown",e=>go(e)||(keys[k]=true)); el.addEventListener("pointerup",()=>keys[k]=false); el.addEventListener("pointerleave",()=>keys[k]=false); };
  hold("btnL","l",true); hold("btnR","r",true);
  $("btnJ").addEventListener("pointerdown",e=>{ e.preventDefault(); keys.j=true; });
  $("btnAct").addEventListener("pointerdown",e=>{ e.preventDefault(); doAct(); });
  window.addEventListener("keydown",e=>{
    if(e.key==="ArrowLeft"||e.key==="a") keys.l=true;
    if(e.key==="ArrowRight"||e.key==="d") keys.r=true;
    if(e.key==="ArrowUp"||e.key==="w"||e.key===" ") keys.j=true;
    if(e.key==="e"||e.key==="Enter") doAct();
  });
  window.addEventListener("keyup",e=>{
    if(e.key==="ArrowLeft"||e.key==="a") keys.l=false;
    if(e.key==="ArrowRight"||e.key==="d") keys.r=false;
    if(e.key==="ArrowUp"||e.key==="w"||e.key===" ") keys.j=false;
  });
}

function sizeCanvas(){
  const c=$("stage"); const dpr=devicePixelRatio||1;
  c.width=innerWidth*dpr; c.height=innerHeight*dpr;
}
function startGame(fresh){
  S = fresh ? blankHold() : (load()||blankHold());
  $("title").classList.remove("on"); $("play").classList.add("on");
  mode="hold"; sizeCanvas(); buildHoldLevel(); renderHud();
  cancelAnimationFrame(raf); requestAnimationFrame(loop);
  clearInterval(startGame._t); startGame._t=setInterval(tick,1000);
  if(fresh){
    $("modal").className="on";
    $("modal").innerHTML=`<div class="card"><h2>THE FIRST NIGHT</h2>
      <p>Walk the hold. Stand on a room and tap ACT to post hands or take stores. The shaft is a ladder — jump while touching it to climb.</p>
      <p>The gate opens the wilds. Wear a body, run the caves, claim the shrine. The altar tends the bloom across the lands.</p>
      <button class="bigbtn" id="ok">I HEAR THE HEARTH</button></div>`;
    $("ok").onclick=()=>$("modal").className="";
  }
}

window.addEventListener("resize",sizeCanvas);
bindPads();
$("btnNew").onclick=()=>startGame(true);
$("btnCont").onclick=()=>startGame(false);
if(load()) $("btnCont").style.display="block";
</script>
