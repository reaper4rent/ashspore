function hash32(s){let h=2166136261;s=String(s);for(let i=0;i<s.length;i++){h^=s.charCodeAt(i);h=Math.imul(h,16777619);}return h>>>0;}
function mulberry(seed){let t=seed>>>0;return()=>{t+=0x6D2B79F5;let x=Math.imul(t^(t>>>15),1|t);x^=x+Math.imul(x^(x>>>7),61|x);return((x^(x>>>14))>>>0)/4294967296;};}

const FACE={};
function paintPortrait(seed){
  if(FACE[seed]) return FACE[seed];
  const rng=mulberry(hash32(seed)); const c=document.createElement("canvas"); c.width=96;c.height=96; const g=c.getContext("2d");
  const glow=["#ff6a2a","#7dff9a","#6ec8ff","#c9a6ff"][Math.floor(rng()*4)];
  g.fillStyle="#140c08"; g.fillRect(0,0,96,96);
  g.fillStyle=`hsl(${18+rng()*28},${42+rng()*30}%,${38+rng()*22}%)`;

  g.fillStyle=glow; g.beginPath(); g.arc(40,48,3,0,6.28); g.arc(56,48,3,0,6.28); g.fill();
  FACE[seed]=c.toDataURL("image/jpeg",.7); return FACE[seed];
}

function consume(dt){

function tickBloom(dt){

    const L=P.lands[r.id]; const alive=Math.max(1,r.pop-L.dead); const inf=Math.min(L.inf,alive);
    L.inf=Math.min(alive,L.inf+inf*(alive-inf)/alive*(.012+P.inf*.004)*climateMul(r.climate,P)*(L.closed?.35:1)*dt);
    const kill=inf*(P.let*.0018)*dt; L.dead=Math.min(r.pop,L.dead+kill*(P.convert?.55:1)); L.inf=Math.max(0,L.inf-kill);
    L.aware=Math.min(100,L.aware+(P.sev*.08-P.stealth*.06)*(inf/alive)*dt*8);
    if(!L.closed && L.aware>55 && inf/alive>.12){ L.closed=true; P.news=r.name+" seals its roads."; }
    (P.veins||[]).filter(v=>v.a===r.id||v.b===r.id).forEach(v=>{
      const nid=v.a===r.id?v.b:v.a, N=P.lands[nid], dest=REGIONS.find(x=>x.id===nid);
      if(!dest||N.inf>dest.pop*.9) return;

      if(inf>80 && Math.random()<ch*dt){ if(N.inf<=0){ P.dna+=3; P.news="First cough in "+dest.name+"."; } N.inf+=8+P.inf*2; }
    });

  if(P.convert && S.dwellers.length<popCap() && Math.random()<.0015*dt){ const d=newDweller("converted"); S.dwellers.push(d); }
  const w=worldStats(), infPct=w.inf/Math.max(1,w.pop-w.dead);

}

function poisson(rng,n,minD){
  const pts=[]; let t=0; while(pts.length<n && t<n*40){ t++; const p={x:.12+rng()*.76,y:.18+rng()*.64}; if(pts.every(q=>Math.hypot(p.x-q.x,p.y-q.y)>=minD)) pts.push(p); }
  return pts;
}
function gabriel(pts){
  const e=[]; for(let i=0;i<pts.length;i++) for(let j=i+1;j<pts.length;j++){
    const mx=(pts[i].x+pts[j].x)/2,my=(pts[i].y+pts[j].y)/2,r=Math.hypot(pts[i].x-pts[j].x,pts[i].y-pts[j].y)/2;
    if(pts.every((p,k)=>k===i||k===j||Math.hypot(p.x-mx,p.y-my)>=r-.001)) e.push([i,j]);
  } return e;
}
function startBattle(regionId){
  const pct=regionPct(regionId); const cost=Math.max(1,6-Math.floor(pct*100/25));
  if(S.res.spirit<cost) return toast("Need spirit.");
  S.res.spirit-=cost; closeSheet();
  $("hold").classList.remove("on"); $("battle").classList.add("on");
  const rng=mulberry(hash32(regionId+":"+S.day));
  const pts=poisson(rng,7,.18); pts.sort((a,b)=>a.x-b.x);
  pts[0].x=.14; pts[pts.length-1].x=.86;
  const edges=gabriel(pts);
  const types=["village","tower","forge","village"];
  const nodes=pts.map((p,i)=>{
    let owner="neutral"; if(i===0||i===1) owner="player"; if(i>=pts.length-2) owner="enemy";
    const type=i===0||i===pts.length-1?"village":types[Math.floor(rng()*types.length)];
    return {id:i,x:p.x,y:p.y,type,owner,n:8+Math.floor(rng()*10)+(owner==="enemy"?8:0),lv:1};
  });
  const grit=S.dwellers.reduce((a,d)=>a+d.grit,0);
  nodes.filter(n=>n.owner==="player").forEach(n=>n.n=Math.floor(n.n+grit*.35+pct*10));
  nodes.filter(n=>n.owner==="enemy").forEach(n=>n.n=Math.max(4,Math.floor(n.n*(1-pct*.35))));
  sendUnit=fac().units[0];
  document.querySelectorAll(".unitbtn").forEach((b,i)=>{
    const u=fac().units[i]; b.dataset.kind=u||""; b.textContent=u?UNITS[u].name.slice(0,3).toUpperCase():"—";
    b.classList.toggle("on",i===0);
  });
  battle={region:regionId,nodes,edges,waves:[],selected:null,t:0,over:false,atkMul:1+Math.min(.4,grit/80)+pct*.25,infPct:pct,ai:0};
  sizeBattle(); loopBattle();
}
function sizeBattle(){
  const c=$("bcanvas"); const dpr=devicePixelRatio||1;
  c.width=innerWidth*dpr; c.height=(innerHeight-72)*dpr; c.style.height=(innerHeight-72)+"px";
}
function loopBattle(){
  const c=$("bcanvas"), ctx=c.getContext("2d");
  let last=performance.now();
  const step=now=>{
    if(!battle||battle.over) return;
    const dt=Math.min(.05,(now-last)/1000); last=now;
    stepBattle(dt); drawBattle(ctx,c);
    raf=requestAnimationFrame(step);
  };
  raf=requestAnimationFrame(step);
}
function linked(a,b){ return battle.edges.some(([x,y])=>(x===a&&y===b)||(x===b&&y===a)); }
function sendWave(fromId,toId,owner,kind,amt){
  const from=battle.nodes[fromId]; if(from.n<1) return;
  amt=Math.max(1,Math.min(from.n,amt)); from.n-=amt;
  const U=UNITS[kind]||UNITS.sporeling;
  battle.waves.push({from:fromId,to:toId,owner,n:amt,p:0,kind,speed:U.speed});
}
function stepBattle(dt){
  battle.t+=dt;
  battle.nodes.forEach(n=>{
    if(n.type==="village"){ const cap=15+n.lv*12; if(n.n<cap) n.n=Math.min(cap,n.n+(n.owner==="neutral"?.6:1.1+n.lv*.35)*dt); }
    if(n.type==="tower"&&n.owner!=="neutral"){
      battle.waves.forEach(w=>{
        if(w.owner===n.owner) return;
        const near=battle.edges.some(([a,b])=>(a===n.id||b===n.id)&&(a===w.from||b===w.from||a===w.to||b===w.to));
        if(w.p>.15&&w.p<.85&&near&&Math.random()<.5*dt) w.n=Math.max(0,w.n-(1.2+n.lv)*(UNITS[w.kind]?.tower||1));
      });
    }
  });
  const forge={}; battle.nodes.forEach(n=>{ if(n.type==="forge"&&n.owner!=="neutral") forge[n.owner]=(forge[n.owner]||1)+.18; });
  const left=[];
  battle.waves.forEach(w=>{
    w.p+=w.speed*dt; if(w.n<=0) return;
    if(w.p<1){ left.push(w); return; }
    const dest=battle.nodes[w.to], U=UNITS[w.kind]||UNITS.sporeling;
    let mul=(forge[w.owner]||1)*(w.owner==="player"?battle.atkMul:1)*U.atk*U.hp;
    if(w.kind==="convert"&&battle.infPct>.25) mul*=1.2;
    if(w.owner==="player"&&fac().id==="raiders") mul*=1.15;
    if(w.owner==="player"&&fac().id==="cairn") mul*=1.1;
    if(dest.owner===w.owner) dest.n+=w.n;
    else { dest.n-=w.n*mul; if(dest.n<=0){ dest.owner=w.owner; dest.n=Math.max(1,Math.floor(-dest.n)); } }
  });
  battle.waves=left;
  battle.ai+=dt;
  if(battle.ai>1.6){
    battle.ai=0;
    const src=battle.nodes.filter(n=>n.owner==="enemy"&&n.n>8).sort((a,b)=>b.n-a.n)[0];
    if(src){
      const tgt=battle.nodes.filter(n=>linked(src.id,n.id)&&(n.owner!=="enemy"||n.n<src.n)).sort((a,b)=>(a.owner==="player"?0:1)- (b.owner==="player"?0:1))[0];
      if(tgt) sendWave(src.id,tgt.id,"enemy",pick(regionFaction(battle.region).units),Math.floor(src.n*.4));
    }
  }
  const owners=new Set(battle.nodes.map(n=>n.owner));
  if(!owners.has("enemy")&&!battle.waves.some(w=>w.owner==="enemy")) endBattle(true);
  if(!owners.has("player")&&!battle.waves.some(w=>w.owner==="player")) endBattle(false);
}
function drawBattle(ctx,c){
  const w=c.width,h=c.height;
  ctx.clearRect(0,0,w,h);
  if(IMG["art/battle.jpg"].complete){ ctx.globalAlpha=.45; ctx.drawImage(IMG["art/battle.jpg"],0,0,w,h); ctx.globalAlpha=1; }
  ctx.fillStyle="#0b070688"; ctx.fillRect(0,0,w,h);
  ctx.strokeStyle="rgba(125,200,120,.45)"; ctx.lineWidth=4*(devicePixelRatio||1);
  battle.edges.forEach(([a,b])=>{ const A=battle.nodes[a],B=battle.nodes[b]; ctx.beginPath(); ctx.moveTo(A.x*w,A.y*h); ctx.lineTo(B.x*w,B.y*h); ctx.stroke(); });
  battle.waves.forEach(wave=>{
    const A=battle.nodes[wave.from],B=battle.nodes[wave.to];
    const x=(A.x+(B.x-A.x)*wave.p)*w, y=(A.y+(B.y-A.y)*wave.p)*h;
    const img=unitImg(wave.kind); const dpr=devicePixelRatio||1;
    const facing=B.x>=A.x?1:-1;
    ctx.save(); ctx.translate(x,y); ctx.scale(facing,1);
    if(img&&img.complete&&img.naturalWidth){
      if(wave.owner==="enemy") ctx.filter="hue-rotate(210deg)";
      ctx.drawImage(img,-18*dpr,-40*dpr,36*dpr,52*dpr); ctx.filter="none";
    } else { ctx.fillStyle=wave.owner==="player"?UNITS[wave.kind].color:"#8b4dff"; ctx.beginPath(); ctx.arc(0,0,10*dpr,0,6.28); ctx.fill(); }
    ctx.restore();
    ctx.fillStyle="#fff"; ctx.font=(10*dpr)+"px sans-serif"; ctx.textAlign="center";
    ctx.fillText(Math.floor(wave.n),x,y+22*dpr);
  });
  battle.nodes.forEach(n=>{
    const x=n.x*w,y=n.y*h,r=22*(devicePixelRatio||1);
    const col=n.owner==="player"?fac().color:n.owner==="enemy"?"#8b4dff":"#6d6458";
    ctx.beginPath(); ctx.arc(x,y,r,0,6.28); ctx.fillStyle="#1a120e"; ctx.fill();
    ctx.lineWidth=(battle.selected===n.id?5:3)*(devicePixelRatio||1); ctx.strokeStyle=col; ctx.stroke();
    ctx.fillStyle="#f4e8d4"; ctx.font=(11*(devicePixelRatio||1))+"px sans-serif"; ctx.textAlign="center";
    ctx.fillText(Math.floor(n.n),x,y+4*(devicePixelRatio||1));
    ctx.font=(8*(devicePixelRatio||1))+"px sans-serif"; ctx.fillText(n.type,x,y+r+12*(devicePixelRatio||1));
  });
}
function endBattle(win){
  if(!battle||battle.over) return; battle.over=true; cancelAnimationFrame(raf);
  const r=REGIONS.find(x=>x.id===battle.region);
  $("modal").className="on";
  if(win){
    S.warsWon++; S.res.bone+=24; S.res.food=clamp(S.res.food+10,0,S.cap.food); S.bloom.dna+=6;
    const L=S.bloom.lands[r.id]; L.inf=Math.min(r.pop-L.dead,L.inf+80+S.bloom.inf*10+(S.bloom.war?120:20));
    if(S.dwellers.length<popCap()&&Math.random()<.5) S.dwellers.push(newDweller("awakened"));
    $("modal").innerHTML=`<div class="card"><h2>THE NODE FALLS</h2><p>${r.name} is yours. Bloom thickens.</p><button class="bigbtn" id="leaveWar">RETURN</button></div>`;
  } else {
    S.happiness=Math.max(15,S.happiness-8);
    $("modal").innerHTML=`<div class="card"><h2>THE ROAD BREAKS</h2><p>March again with more grit.</p><button class="bigbtn" id="leaveWar">RETURN</button></div>`;
  }
  $("leaveWar").onclick=()=>{ $("modal").className=""; $("battle").classList.remove("on"); $("hold").classList.add("on"); battle=null; renderHold(); };
}
function usePower(){
  const F=fac(); if(S.powerCd>0) return toast(F.power.name+" rests "+Math.ceil(S.powerCd)+"s");
  S.powerCd=F.power.cd;
  if(!battle){ toast(F.power.name+" — march to use it on the roads."); return; }
  if(F.power.id==="hearthburst") battle.waves.filter(w=>w.owner==="enemy").forEach(w=>w.n=Math.max(0,w.n-6));
  if(F.power.id==="bonewall") battle.nodes.filter(n=>n.owner==="player").forEach(n=>n.n+=6);
  if(F.power.id==="mistveil") battle.waves.filter(w=>w.owner==="player").forEach(w=>w.speed+=.2);
  if(F.power.id==="blackwing") battle.waves.filter(w=>w.owner==="player").forEach(w=>w.speed+=.35);
  if(F.power.id==="tidepull"){ S.res.spirit=clamp(S.res.spirit+6,0,S.cap.spirit); S.res.food=clamp(S.res.food+8,0,S.cap.food); }
  if(F.power.id==="scorch") battle.atkMul+=.35;
  if(F.power.id==="fogstep") battle.waves.filter(w=>w.owner==="player").forEach(w=>w.p=Math.min(.95,w.p+.25));
  if(F.power.id==="silencerite"&&S.bloom.cureOn) S.bloom.cure=Math.max(0,S.bloom.cure-18);
  toast(F.power.name);
}

function openBloom(){
  const P=S.bloom,w=worldStats(),infPct=Math.floor(100*w.inf/Math.max(1,w.pop-w.dead));
  const el=$("sheet"); el.classList.add("on");
  el.innerHTML=`<h2>ASHSPORE BLOOM</h2>
    <div class="statgrid"><div class="statbox"><b>${Math.floor(P.dna)}</b><small>DNA</small></div>
    <div class="statbox"><b>${infPct}%</b><small>bloom</small></div>
    <div class="statbox"><b>${P.cureOn?Math.floor(P.cure)+"%":"—"}</b><small>rival rite</small></div></div>
    <div id="worldwrap"><div id="atlas">${REGIONS.map(r=>{
      const pct=regionPct(r.id),L=P.lands[r.id];
      return `<button class="region" data-reg="${r.id}" style="left:${r.x}%;top:${r.y}%;border-color:${L.closed?"#c44536":pct>.05?"#7dff9a":"#4a5a38"}">${r.name.split(" ")[0]}<br>${Math.floor(pct*100)}%</button>`;
    }).join("")}</div><canvas id="fog"></canvas></div>
    <p style="font-size:12px;color:#cbb89a">${P.news} · tap two blooming lands to grow a vein (6 DNA)</p>
    ${["carry","mark","craft"].map(br=>`<div style="color:#9a846c;font-size:11px;letter-spacing:.12em;margin:8px 0 4px">${br.toUpperCase()}</div>
      ${EVOLUTIONS.filter(e=>e.branch===br).map(e=>{
        const on=P.evolved.includes(e.id);
        return `<div class="row"><div><b>${on?"✓ ":""}${e.name}</b><small>${e.desc} · ${e.cost}</small></div>
          <button class="mini ${on?"":"hot"}" data-ev="${e.id}" ${on?"disabled":""}>${on?"IN":"GROW"}</button></div>`;
      }).join("")}`).join("")}
    <button class="mini" style="width:100%" id="x">CLOSE</button>`;
  let pickA=null;
  el.querySelectorAll("[data-reg]").forEach(b=>b.onclick=()=>{
    const id=b.dataset.reg;
    if(pickA&&pickA!==id){ growVein(pickA,id); pickA=null; openBloom(); return; }
    pickA=id; const r=REGIONS.find(x=>x.id===id); toast(r.name+" · tap another blooming land");
  });
  el.querySelectorAll("[data-ev]").forEach(b=>b.onclick=()=>evolve(b.dataset.ev));
  $("x").onclick=closeSheet; startFog();
}
function growVein(a,b){
  const P=S.bloom; if(regionPct(a)<.05||regionPct(b)<.05) return toast("Both lands must bloom.");
  if(P.dna<6) return toast("Need 6 DNA."); P.dna-=6;
  const ex=P.veins.find(v=>(v.a===a&&v.b===b)||(v.a===b&&v.b===a));
  if(ex) ex.grown=true; else P.veins.push({a,b,flow:1,grown:true}); toast("A living vein thickens.");
}
function evolve(id){
  const P=S.bloom,ev=EVOLUTIONS.find(e=>e.id===id); if(!ev||P.evolved.includes(id)) return;
  if(P.dna<ev.cost) return toast("Need DNA."); P.dna-=ev.cost; P.evolved.push(id);
  Object.entries(ev.fx).forEach(([k,v])=>{ if(k==="burst") REGIONS.forEach(r=>{ if(P.lands[r.id].inf>0) P.lands[r.id].inf+=220; }); else P[k]=(P[k]||0)+v; });
  toast("Grew "+ev.name); openBloom();
}
function startFog(){
  const c=$("fog"), wrap=$("worldwrap"); if(!c||!wrap) return;
  c.width=wrap.clientWidth; c.height=wrap.clientHeight; const ctx=c.getContext("2d");
  const parts=Array.from({length:20},()=>({x:Math.random()*c.width,y:Math.random()*c.height,r:8+Math.random()*14,v:8}));
  const step=()=>{ if(!$("fog")) return; ctx.clearRect(0,0,c.width,c.height);
    parts.forEach(p=>{ p.y-=p.v*.016; if(p.y<0) p.y=c.height; ctx.fillStyle="rgba(125,255,154,.1)"; ctx.beginPath(); ctx.arc(p.x,p.y,p.r,0,6.28); ctx.fill(); });
    (S.bloom.veins||[]).forEach(v=>{ const A=REGIONS.find(r=>r.id===v.a),B=REGIONS.find(r=>r.id===v.b);
      ctx.strokeStyle=v.grown?"rgba(255,180,70,.7)":"rgba(125,255,154,.35)"; ctx.beginPath();
      ctx.moveTo(A.x/100*c.width,A.y/100*c.height); ctx.lineTo(B.x/100*c.width,B.y/100*c.height); ctx.stroke(); });
    requestAnimationFrame(step); };
  requestAnimationFrame(step);
}

function tick(){ if(!S) return; S.t++; if(S.t%60===0) S.day++; consume(1); tickBloom(1); if(S.t%8===0) save(); if($("hold").classList.contains("on")) renderHold(); }
function pickTribe(){
  $("modal").className="on";
  $("modal").innerHTML=`<div class="card"><h2>CHOOSE YOUR TRIBE</h2>
    ${Object.values(FACTIONS).map(f=>`<div class="row"><div><b style="color:${f.color}">${f.name}</b><small>${f.plus} · ${f.minus}</small></div>
      <button class="mini hot" data-f="${f.id}">CLAIM</button></div>`).join("")}</div>`;
  $("modal").querySelectorAll("[data-f]").forEach(b=>b.onclick=()=>{ $("modal").className=""; startGame(true,b.dataset.f); });
}
function startGame(fresh,fid){
  S=fresh?blankHold(fid||"ashborn"):(load()||blankHold("ashborn"));
  $("title").classList.remove("on"); $("hold").classList.add("on");
  renderHold(); clearInterval(startGame._t); startGame._t=setInterval(tick,1000);
  if(fresh){ $("modal").className="on"; $("modal").innerHTML=`<div class="card"><h2>${fac().name.toUpperCase()}</h2>
    <p>Tap rooms to post hands and take stores. WILDS: tap your village, then a linked node. BLOOM: spend DNA, tap two lands to grow a vein.</p>
    <button class="bigbtn" id="ok">I HEAR THE HEARTH</button></div>`; $("ok").onclick=()=>$("modal").className=""; }
}

$("bcanvas").addEventListener("click",ev=>{
  if(!battle||battle.over) return;
  const c=$("bcanvas"), rect=c.getBoundingClientRect();
  const x=(ev.clientX-rect.left)/rect.width, y=(ev.clientY-rect.top)/rect.height;
  let hit=null,best=1;
  battle.nodes.forEach(n=>{ const d=Math.hypot(n.x-x,n.y-y); if(d<.08&&d<best){best=d;hit=n;} });
  if(!hit){ battle.selected=null; return; }
  if(battle.selected==null){ if(hit.owner!=="player") return toast("Not yours."); battle.selected=hit.id; $("bhint").textContent="Tap a linked node."; }
  else if(battle.selected===hit.id){ if(hit.type==="village"&&hit.n>=12&&hit.lv<3){ hit.n-=10; hit.lv++; toast("Village lv"+hit.lv); } battle.selected=null; }
  else { if(!linked(battle.selected,hit.id)) return toast("No road."); sendWave(battle.selected,hit.id,"player",sendUnit||fac().units[0],Math.floor(battle.nodes[battle.selected].n*sendPct/100)); battle.selected=null; $("bhint").textContent="Tap yours, then a linked node."; }
});
document.querySelectorAll(".pct").forEach(b=>b.onclick=()=>{ sendPct=+b.dataset.p; document.querySelectorAll(".pct").forEach(x=>x.classList.toggle("on",x===b)); });
document.querySelectorAll(".unitbtn").forEach(b=>b.onclick=()=>{
  if(!b.dataset.kind) return; sendUnit=b.dataset.kind;
  document.querySelectorAll(".unitbtn").forEach(x=>x.classList.toggle("on",x===b));
});
$("btnFlee").onclick=()=>{ if(battle) endBattle(false); };
$("btnPow").onclick=usePower;
$("btnPeople").onclick=openPeople;
$("btnBuild").onclick=()=>{ const empty=allRooms().find(x=>!x.floor.locked&&x.room.type==="empty"); if(empty) openBuild(empty.room); else toast("No hollow."); };
$("btnWar").onclick=openWar;
$("btnBloom").onclick=openBloom;
$("btnNew").onclick=pickTribe;
$("btnCont").onclick=()=>startGame(false);
if(load()) $("btnCont").style.display="block";
window.addEventListener("resize",()=>{ if(battle) sizeBattle(); });
</script>
</body>
